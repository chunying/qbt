services:
  main:
    image: chuang/qbt
    pull_policy: build
    build:
      context: .
      pull: false
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      USER_UID: ${_UID:-1000}
      USER_GID: ${_GID:-1000}
    ports:
      - "127.0.0.1:9080:9080"
    volumes:
      - ./vpn:/etc/wireguard:ro
      - ./entrypoint.sh:/entrypoint.sh:ro
      - ./qbt:/home/qbt/qBittorrent
